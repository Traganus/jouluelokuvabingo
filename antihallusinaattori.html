<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tekstivertailu</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,sans-serif; color:#222; background:#f5f5f5; }
  header { padding:18px 22px; background:white; border-bottom:1px solid #ddd; }
  h1 { margin:0 0 6px; font-size:22px; }
  p { margin:4px 0; color:#555; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:16px; background:#fafafa; }
  .pane { background:white; border:1px solid #ccc; border-radius:8px; overflow:hidden; }
  .pane h2 { font-size:15px; margin:0; padding:10px 12px; border-bottom:1px solid #ddd; }
  textarea { display:block; width:100%; min-height:260px; resize:vertical; border:0; padding:12px; font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; outline:none; }
  button { margin:0 16px 16px; padding:9px 14px; border:1px solid #bbb; border-radius:7px; background:white; cursor:pointer; }
  button:hover { background:#eee; }
  #compare { display:grid; grid-template-columns:1fr 1fr; gap:0; margin:0 16px 24px; border:1px solid #ccc; background:white; }
  .col { min-width:0; font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; white-space:pre-wrap; overflow-wrap:anywhere; }
  .col-title { position:sticky; top:0; z-index:2; padding:9px 12px; background:#f7f7f7; border-bottom:1px solid #ccc; font:bold 13px system-ui,sans-serif; }
  .content { padding:12px; min-height:120px; }
  .left { border-right:1px solid #ccc; }
  .same { background:rgba(65,190,255,.3); }
  .diff { background:rgba(255,190,60,.9); text-decoration: underline dotted; font-weight: 700;}
  .added { background:rgba(255,190,60,.9); text-decoration: underline dotted; font-weight: 700;}
  .gap { display:inline-block; width:100%; min-height:1.5em; background:rgba(255,210,0,.12); }
  .empty-note { color:#999; font:italic 13px system-ui,sans-serif; }
  @media(max-width:800px){ .controls,#compare{grid-template-columns:1fr;} .left{border-right:0;border-bottom:1px solid #ccc;} }
</style>
</head>
<body>
<header>
  <h1>Tekstivertailu</h1>
  <p>Liitä vasemmalle alkuperäinen teksti ja oikealle muunnettu teksti. Koko massa näytetään aina.</p>
</header>

<section class="controls">
  <div class="pane">
    <h2>1. Alkuperäinen</h2>
    <textarea id="original" placeholder="Ctrl+C / Ctrl+V Wordista tänne..."></textarea>
  </div>
  <div class="pane">
    <h2>2. Uusi formaatti</h2>
    <textarea id="converted" placeholder="Liitä GIFT, HTML-taulukko tai muu muunnettu teksti tänne..."></textarea>
  </div>
</section>
<button id="compareBtn">Vertaa</button>

<section id="compare" aria-live="polite">
  <div class="col left">
    <div class="col-title">ALKUPERÄINEN</div>
    <div class="content" id="leftOut"><span class="empty-note">Ei vielä vertailtavaa tekstiä.</span></div>
  </div>
  <div class="col">
    <div class="col-title">UUSI FORMAATTI</div>
    <div class="content" id="rightOut"><span class="empty-note">Ei vielä vertailtavaa tekstiä.</span></div>
  </div>
</section>

<script>
function tokenize(s) {
  // Preserve whitespace/newlines as tokens so the original visual layout remains visible.
  return s.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}]/gu) || [];
}

function key(t) {
  // Matching ignores whitespace and punctuation/case, but display keeps the raw text.
  if (/^\s+$/.test(t)) return null;
  if (/^[\\p{L}\\p{N}_]+$/u.test(t)) return t.toLocaleLowerCase('fi-FI');
  return t;
}

function meaningful(tokens) {
  return tokens.map((t,i)=>({t,i,k:key(t)})).filter(x=>x.k!==null);
}

// Hunt-Szymanski-ish greedy ordered alignment.
// It never reorders content: matches always move forward in both texts.
// We prefer longer local runs, which helps repeated phrases such as "Newtonin ... laki".
function align(a,b) {
  // Global, order-preserving alignment. Unlike the old greedy matcher,
  // this can deliberately skip a whole region and then synchronize again.
  // Whitespace and punctuation are not alignment tokens.
  const A=meaningful(a), B=meaningful(b);
  const n=A.length, m=B.length;
  if(!n || !m) return [];

  // Give rarer words more weight. Very common words ("on", "ja", "mikä", ...)
  // are therefore less useful as anchors than distinctive content words.
  const freqA=new Map(), freqB=new Map();
  for(const x of A) freqA.set(x.k,(freqA.get(x.k)||0)+1);
  for(const x of B) freqB.set(x.k,(freqB.get(x.k)||0)+1);

  const gap=-2;
  const width=m+1;

  // Only two score rows are needed; directions are stored for backtracking.
  const prev=new Int16Array(width);
  const curr=new Int16Array(width);
  const dir=new Uint8Array((n+1)*width); // 1=diagonal, 2=up, 3=left

  for(let j=1;j<=m;j++){ prev[j]=prev[j-1]+gap; dir[j]=3; }

  for(let i=1;i<=n;i++){
    curr[0]=prev[0]+gap;
    dir[i*width]=2;

    for(let j=1;j<=m;j++){
      let match=-1;
      if(A[i-1].k===B[j-1].k){
        const f=(freqA.get(A[i-1].k)||1)+(freqB.get(B[j-1].k)||1);
        match=2 + Math.max(0, 3-Math.min(3,f-1));
      }

      const diag=prev[j-1]+match;
      const up=prev[j]+gap;
      const left=curr[j-1]+gap;

      if(diag>=up && diag>=left){
        curr[j]=diag; dir[i*width+j]=1;
      } else if(up>=left){
        curr[j]=up; dir[i*width+j]=2;
      } else {
        curr[j]=left; dir[i*width+j]=3;
      }
    }
    prev.set(curr);
  }

  const pairs=[];
  let i=n, j=m;
  while(i>0 || j>0){
    const d=dir[i*width+j];
    if(d===1){
      if(A[i-1].k===B[j-1].k) pairs.push([A[i-1].i,B[j-1].i]);
      i--; j--;
    } else if(d===2) {
      i--;
    } else {
      j--;
    }
  }
  pairs.reverse();
  return pairs;
}
function render(original, converted) {
  const a=tokenize(original), b=tokenize(converted);
  const pairs=align(a,b);
  const mapA=new Map(), mapB=new Map();
  pairs.forEach(([i,j])=>{mapA.set(i,j);mapB.set(j,i);});

  // Render token-by-token. Matching tokens are highlighted softly.
  // Nonmatching tokens remain fully visible. Whitespace is untouched.
  let left='', right='';
  for(let i=0;i<a.length;i++){
    const t=a[i];
    const esc=escapeHtml(t);
    if(mapA.has(i)) left += '<span class="same">'+esc+'</span>';
    else if(/\s+/.test(t)) left += esc;
    else left += '<span class="diff">'+esc+'</span>';
  }
  for(let j=0;j<b.length;j++){
    const t=b[j];
    const esc=escapeHtml(t);
    if(mapB.has(j)) right += '<span class="same">'+esc+'</span>';
    else if(/\s+/.test(t)) right += esc;
    else right += '<span class="added">'+esc+'</span>';
  }
  document.getElementById('leftOut').innerHTML=left || '<span class="empty-note">Tyhjä.</span>';
  document.getElementById('rightOut').innerHTML=right || '<span class="empty-note">Tyhjä.</span>';
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('compareBtn').addEventListener('click',()=>{
  render(document.getElementById('original').value, document.getElementById('converted').value);
});

// Also update while typing/pasting, with a small debounce.
let timer;
for(const id of ['original','converted']){
  document.getElementById(id).addEventListener('input',()=>{
    clearTimeout(timer);
    timer=setTimeout(()=>render(
      document.getElementById('original').value,
      document.getElementById('converted').value
    ),180);
  });
}
</script>
</body>
</html>
